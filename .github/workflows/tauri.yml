# Tauri sidecar CI (RON-397 M0): Linux release bundle for tauri/, path-gated
# so product CI stays fast. Same Namespace runner shape as product.yml.
# Ubuntu-only (Windows/macOS arrive in M5).

name: tauri

on:
  push:
    branches: ["migration/**", "feat/**", "fix/**", "docs/**", "chore/**"]
    paths:
      - "tauri/**"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "tauri/**"
      - ".github/workflows/tauri.yml"

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Same push/PR dedupe as product.yml: an open PR on the branch means the
  # PR run does the work and this push run stands down.
  dedupe:
    name: skip push when a PR covers it
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run-ci: ${{ steps.check.outputs.run-ci }}
    steps:
      - name: Check for an open PR on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(curl -fsSL -G \
            --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            --data-urlencode "state=open" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            | python3 -c 'import json,sys
          try:
              data = json.load(sys.stdin)
              print(len(data) if isinstance(data, list) else -1)
          except Exception:
              print(-1)' || echo -1)"
          # Fail open: an API blip must cost a duplicate run, never a
          # silently skipped gate.
          if [ "${count:--1}" -ge 1 ]; then
            echo "run-ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
          fi
  bundle-linux:
    name: bundle Linux release
    needs: dedupe
    if: needs.dedupe.outputs.run-ci == 'true'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-hmmagainagain-tauri
      # Without an allow-commit label the volume never writes back, so
      # every run recompiles all crates cold. migration/tauri is where
      # every tauri/ change lands; feature branches read that warmth.
      - nscloud-cache-allow-commit-from-migration/tauri
      - nscloud-git-mirror-5gb
      - nscloud-runner-tool-cache-20gb
    permissions:
      contents: read
    steps:
      - name: Check out (cached mirror)
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      - name: Set up Node + Rust
        # Tags, not SHAs: SHAs unverifiable from here; pin them on first
        # green CI review (M0 follow-up).
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        # NOTE: never cache ~/.cargo itself — the mount shadows the
        # just-installed toolchain (rustup + cargo vanish for later steps).
        # Cache only the registry downloads and the build tree. apt joins
        # the list so the webview headers below install from cache.
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: |
            apt
          path: |
            ~/.cargo/registry
            tauri/src-tauri/target

      - name: Verify Rust toolchain
        run: |
          which cargo rustc
          cargo --version
          rustc --version

      - name: Install system webview headers
        run: |
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -qy libwebkit2gtk-4.1-dev
          }

      - name: Install frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Build bundle
        # CI-only profile relief: the shipped profile (lto=true,
        # codegen-units=1) links for minutes on 4 cores. These env
        # overrides trade bundle size for CI speed; Cargo.toml — and the
        # release artifact — are untouched.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
        working-directory: tauri
        run: npx tauri build

      - name: Report bundle
        run: |
          bundle="$(ls tauri/src-tauri/target/release/bundle/*/hmmagainagain* 2>/dev/null | head -1)"
          if [ -n "$bundle" ]; then
            bytes="$(stat -c %s "$bundle")"
            echo "bundle=$bundle bytes=$bytes ($(awk "BEGIN {printf \"%.1f\", $bytes/1024/1024}") MiB)"
          else
            echo "no bundle artifact found"
            exit 1
          fi
