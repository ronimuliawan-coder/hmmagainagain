name: Sync dev to master

# `master` is the default branch and receives `dev` in batches through a promotion
# pull request (from unit U8 onward; before that `master` simply mirrors `dev`).
# Once a promotion merges, `dev` is strictly behind `master` and every later unit
# branch cut from `dev` starts from stale code. The fix is a fast-forward of `dev`
# up to `master` after each promotion, which this automates so it is not a manual
# step anyone has to remember.
#
# Why this is safe: neither push below is forced, so git itself refuses anything
# that is not a fast-forward. The ancestry checks in the script exist to tell the
# healthy no-op cases apart from the two-sided case and to fail with a useful
# message, not to make the push safe. Where both branches hold commits the other
# lacks, which happens when `dev` moves while a promotion is open, `master` is
# merged into `dev` rather than fast-forwarded. Nothing here can discard a commit.
#
# Why promotion PRs must use merge commits: a clean fast-forward is only possible
# because the promotion merge commit carries `dev`'s tip as a parent, which keeps
# `master` a descendant of `dev`. Squash and rebase rewrite history into commits
# `dev` has never seen; both are disabled in repository settings.
#
# Adapted from the owner's wandernest reference workflow (governance alignment,
# RON-293); the preview-dispatch jobs there are not applicable to this repository.

on:
  push:
    branches: [ master ]

# Only the ref update matters, so this deliberately has no `paths-ignore`: a
# documentation-only merge moves `master` and leaves `dev` behind exactly like any
# other merge does.

permissions: {}

# Never cancel a sync in flight. A cancelled run leaves `dev` behind with no retry,
# which is the drift this workflow exists to prevent.
concurrency:
  group: sync-dev-to-master
  cancel-in-progress: false

jobs:
  fast-forward-dev:
    name: Fast-forward dev to master
    permissions:
      contents: write
    # Tiny git-only job: smallest Namespace shape, no cache volume to bill.
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry checks need real history, not a depth-1 cone.
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward dev to master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git` ignores GITHUB_TOKEN in the environment, and
          # `persist-credentials: false` left `origin` unauthenticated — so
          # every remote operation below addresses this authenticated URL.
          # (CodeRabbit finding on the U0–U8 promotion review; without it the
          # sync fails on this private repository.)
          auth_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          max_attempts=3
          master_sha="$(git rev-parse refs/remotes/origin/master)"
          echo "master: $master_sha"

          for attempt in $(seq 1 "$max_attempts"); do
            if [ "$attempt" -gt 1 ]; then
              echo "--- attempt $attempt of $max_attempts"
            fi

            # `dev` is recreated from `master` if it is missing, which is the
            # correct starting state for the next batch.
            if ! git ls-remote --exit-code --heads "$auth_remote" dev >/dev/null 2>&1; then
              echo "Branch \`dev\` does not exist; creating it at master ($master_sha)."
              if git push "$auth_remote" "$master_sha:refs/heads/dev"; then
                echo "Created \`dev\` at \`$master_sha\`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Push rejected; \`dev\` was created underneath us. Refetching."
              continue
            fi

            git fetch --quiet "$auth_remote" dev
            dev_sha="$(git rev-parse FETCH_HEAD)"
            echo "dev:    $dev_sha"

            if [ "$master_sha" = "$dev_sha" ]; then
              echo "Already in sync; nothing to do."
              echo "\`dev\` already matches \`master\` at \`$master_sha\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # `dev` behind `master`: the promotion case this workflow exists for.
            if git merge-base --is-ancestor "$dev_sha" "$master_sha"; then
              behind="$(git rev-list --count "$dev_sha..$master_sha")"
              echo "dev is $behind commit(s) behind master; fast-forwarding."
              if git push "$auth_remote" "$master_sha:refs/heads/dev"; then
                {
                  echo "Fast-forwarded \`dev\` $behind commit(s) to \`$master_sha\`."
                  echo ""
                  echo "\`dev\` and \`master\` are now the same commit."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Push rejected; \`dev\` advanced during the check. Refetching."
              continue
            fi

            # `dev` already contains `master` and has moved on. Healthy mid-cycle
            # state: new work has landed on `dev` since the promotion. Fast-forward
            # here would rewind `dev`, so this stays a no-op.
            if git merge-base --is-ancestor "$master_sha" "$dev_sha"; then
              ahead="$(git rev-list --count "$master_sha..$dev_sha")"
              echo "dev is $ahead commit(s) ahead of master and already contains it; nothing to do."
              {
                echo "\`dev\` is $ahead commit(s) ahead of \`master\` and already contains it."
                echo ""
                echo "No action taken. New work has landed on \`dev\` since the last promotion."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Neither branch contains the other. The benign cause is a push to
            # `dev` while the promotion was open: merge `master` into `dev`
            # instead. Nothing is discarded; the merge keeps `dev`'s tip as its
            # first parent, so the push below is still a fast-forward.
            behind="$(git rev-list --count "$dev_sha..$master_sha")"
            ahead="$(git rev-list --count "$master_sha..$dev_sha")"

            echo "dev is $behind behind and $ahead ahead of master; merging master into dev."

            git checkout --quiet --detach "$dev_sha"

            if ! git merge --no-edit -m "Merge master into dev after promotion" "$master_sha"; then
              git merge --abort || true
              {
                echo "## \`dev\` has diverged from \`master\` and will not merge"
                echo ""
                echo "- \`master\`: \`$master_sha\`"
                echo "- \`dev\`: \`$dev_sha\` ($behind behind, $ahead ahead)"
                echo ""
                echo "Neither branch is an ancestor of the other, so \`dev\` cannot be"
                echo "fast-forwarded, and merging \`master\` into it conflicts. This"
                echo "workflow will not force either one."
                echo ""
                echo "Recovering needs a human decision: confirm \`master\` holds"
                echo "everything \`dev\` had, then reset \`dev\` to \`master\`. If \`dev\`"
                echo "holds work \`master\` does not, resolve the merge by hand instead."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=dev has diverged from master::Cannot fast-forward or merge without conflict. See the run summary."
              exit 1
            fi

            merged_sha="$(git rev-parse HEAD)"
            echo "Merged cleanly as $merged_sha; pushing to dev."
            if git push "$auth_remote" "$merged_sha:refs/heads/dev"; then
              {
                echo "\`dev\` had $ahead commit(s) \`master\` did not, so it could not"
                echo "be fast-forwarded. Merged \`master\` into it as \`$merged_sha\`."
                echo ""
                echo "Nothing was discarded and nothing was forced."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Push rejected; \`dev\` advanced during the merge. Discarding $merged_sha and refetching."
          done

          # Every attempt lost the race. Nothing is broken or forced, but say so
          # rather than exiting green on work that did not happen.
          {
            echo "## Could not sync \`dev\` after $max_attempts attempts"
            echo ""
            echo "Every push was rejected because \`dev\` advanced first. Re-running"
            echo "this workflow is safe and is usually enough once pushes settle."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Could not sync dev::Lost the race with a concurrent push to dev $max_attempts times. Re-run when pushes settle."
          exit 1
