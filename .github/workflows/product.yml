# Product CI on Namespace runners (RON-316): the full local gate plus a
# Linux stable build, on every push and pull request. Single job (one queue,
# one checkout, one install) with a warm cache volume — faster than split
# jobs on ephemeral runners.
#
# Runner choice is raw Namespace labels (no dashboard profile dependency).
# Shape 4x8: this workload (tsc/biome/tests/vite/zstd) is single-threaded
# bound — 8x16 doubles cost for no measurable gain. Cache volume carries
# bun/apt/toolchain/hutch caches; git mirrors skip the full clone.
# Ubuntu-only: Windows/macOS distribution is post-v1, so a wider matrix
# would be decorative, not coverage. No secrets.

name: product

on:
  push:
    branches: [dev, master, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:

# A newer push supersedes the run in flight — except the dev↔master sync,
# which owns its own never-cancel concurrency (see sync-dev-to-master.yml).
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate-and-build:
    name: gate + Linux stable build
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-hmmagainagain-product
      - nscloud-cache-allow-commit-from-dev
      - nscloud-cache-allow-commit-from-master
      - nscloud-git-mirror-5gb
      - nscloud-runner-tool-cache-20gb
    permissions:
      contents: read
    steps:
      - name: Check out (cached mirror)
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Set up Namespace caches (bun + apt + hutch toolchains)
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: |
            bun
            apt
          # Whole ~/.hutch home (not subpaths): the install marker lives at
          # its root, and mounting only subdirs leaves an unmarked home the
          # installer refuses to claim. Version upgrades need a cache bust.
          path: |
            ~/.hutch

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Hutch
        run: |
          # PATH first: a cache-restored hutch must be found, or the
          # installer refuses to claim the pre-existing ~/.hutch home.
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.hutch/bin:$PATH"
          command -v hutch >/dev/null || curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh

      - name: Prepare Electrobun devkit
        # Generates .hutch/devkit (tsconfig base + electrobun types) that
        # tsconfig.json extends and tsc requires. Gitignored by design.
        run: hutch electrobun prepare

      - name: Gate (tsc + biome + bun test)
        run: bun run check

      - name: Install system webview headers
        run: |
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -qy libwebkit2gtk-4.1-dev
          }

      - name: Stable build
        run: hutch run build

      - name: Report payload
        run: |
          payload="$(ls build/stable-linux-x64/hmmagainagain/Resources/*.tar.zst | head -1)"
          bytes="$(stat -c %s "$payload")"
          echo "payload=$payload bytes=$bytes ($(awk "BEGIN {printf \"%.1f\", $bytes/1024/1024}") MiB)"
