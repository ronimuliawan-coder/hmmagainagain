# Product CI on Namespace runners (RON-316, gate-only since M6): typecheck +
# biome + bun test on every push and pull request. The shipped bundles moved
# to the tauri workflow with the M6 cutover — this lane no longer builds.
#
# Runner choice is raw Namespace labels (no dashboard profile dependency).
# Shape 4x8: this workload (tsc/biome/tests) is single-threaded
# bound — 8x16 doubles cost for no measurable gain. Cache volume carries
# bun/apt caches; git mirrors skip the full clone.
# Ubuntu-only: Windows/macOS distribution is post-v1, so a wider matrix
# would be decorative, not coverage. No secrets.

name: product

on:
  push:
    branches: [dev, master, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:

# A newer push supersedes the run in flight — except the dev↔master sync,
# which owns its own never-cancel concurrency (see sync-dev-to-master.yml).
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # A push to a PR branch would otherwise run this workflow twice (push +
  # pull_request events, same head). When an open PR already covers the
  # branch, the PR run does the work and the push run stands down. Tiny
  # github-hosted check; the heavy job keeps its Namespace runner.
  dedupe:
    name: skip push when a PR covers it
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run-ci: ${{ steps.check.outputs.run-ci }}
    steps:
      - name: Check for an open PR on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(curl -fsSL --max-time 30 -G \
            --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            --data-urlencode "state=open" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            | python3 -c 'import json,sys
          try:
              data = json.load(sys.stdin)
              print(len(data) if isinstance(data, list) else -1)
          except Exception:
              print(-1)' || echo -1)"
          # Fail open: an API blip must cost a duplicate run, never a
          # silently skipped gate. curl failure yields count=-1 via ||.
          if [ "${count:--1}" -ge 1 ]; then
            echo "run-ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
          fi
  gate-and-build:
    name: gate (tsc + biome + bun test)
    needs: dedupe
    if: needs.dedupe.outputs.run-ci == 'true'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-hmmagainagain-product
      - nscloud-cache-allow-commit-from-dev
      - nscloud-cache-allow-commit-from-master
      - nscloud-git-mirror-5gb
      - nscloud-runner-tool-cache-20gb
    permissions:
      contents: read
    steps:
      - name: Check out (cached mirror)
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Set up Namespace caches (bun + apt)
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: |
            bun
            apt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (tsc + biome + bun test)
        run: bun run check
