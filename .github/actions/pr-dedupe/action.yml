name: pr-dedupe
description: >-
  Skip push runs when an open PR covers the branch (a push to a PR branch
  would otherwise run the workflow twice). Emits run-ci=false in that case,
  true otherwise. Fail open: an API blip costs a duplicate run, never a
  silently skipped gate.
inputs:
  github-token:
    description: Token for the PR lookup API call.
    required: true
outputs:
  run-ci:
    description: Whether the caller job should run.
    value: ${{ steps.check.outputs.run-ci }}
runs:
  using: composite
  steps:
    - id: check
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" != push ]; then
          echo "run-ci=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        count="$(curl -fsSL --max-time 30 -G \
          --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
          --data-urlencode "state=open" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
          | python3 -c 'import json,sys
        try:
            data = json.load(sys.stdin)
            print(len(data) if isinstance(data, list) else -1)
        except Exception:
            print(-1)' || echo -1)"
        if [ "${count:--1}" -ge 1 ]; then
          echo "run-ci=false" >> "$GITHUB_OUTPUT"
        else
          echo "run-ci=true" >> "$GITHUB_OUTPUT"
        fi
